name: pilot-docx

on:
  pull_request:
    paths:
      - ".github/workflows/pilot-docx.yml"
      - "core/mellow_chat_runtime/requirements-test.txt"
      - "core/mellow_link/requirements-test-pilot.txt"
      - "core/mellow_link/routers/projects.py"
      - "core/mellow_link/services/doc_service.py"
      - "core/mellow_link/services/project_results/**"
      - "core/mellow_link/services/refactoring_support_engine/source_question_guard.py"
      - "core/mellow_link/modules/rebuild_assistant/samples/pilot_demo/**"
      - "core/mellow_link/tests/test_docx_polish_layer.py"
      - "core/mellow_link/tests/test_project_result_archive.py"
      - "core/mellow_link/tests/test_pilot_demo_samples.py"
      - "core/mellow_link/tests/test_source_question_guard.py"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pilot-docx.yml"
      - "core/mellow_chat_runtime/requirements-test.txt"
      - "core/mellow_link/requirements-test-pilot.txt"
      - "core/mellow_link/routers/projects.py"
      - "core/mellow_link/services/doc_service.py"
      - "core/mellow_link/services/project_results/**"
      - "core/mellow_link/services/refactoring_support_engine/source_question_guard.py"
      - "core/mellow_link/modules/rebuild_assistant/samples/pilot_demo/**"
      - "core/mellow_link/tests/test_docx_polish_layer.py"
      - "core/mellow_link/tests/test_project_result_archive.py"
      - "core/mellow_link/tests/test_pilot_demo_samples.py"
      - "core/mellow_link/tests/test_source_question_guard.py"

jobs:
  pilot-docx:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core/mellow_link

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pilot DOCX test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test-pilot.txt

      - name: Run pilot DOCX regression suite
        run: |
          python -m pytest -q \
            tests/test_docx_polish_layer.py \
            tests/test_project_result_archive.py \
            tests/test_pilot_demo_samples.py \
            tests/test_source_question_guard.py
