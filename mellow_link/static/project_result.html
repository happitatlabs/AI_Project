<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>결과 패키지</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: "Pretendard", "Segoe UI", sans-serif; }
        @media print {
            .no-print { display: none !important; }
            body { background: #fff !important; color: #111827 !important; }
            .print-card { border-color: #d1d5db !important; background: #fff !important; color: #111827 !important; box-shadow: none !important; }
        }
    </style>
</head>
<body class="min-h-screen bg-[radial-gradient(circle_at_top,_#0f172a,_#020617_60%)] text-slate-100">
    <div class="max-w-7xl mx-auto px-6 py-8">
        <header class="no-print flex flex-wrap items-center justify-between gap-4">
            <div>
                <p class="text-xs uppercase tracking-[0.28em] text-cyan-300/80">Result Package</p>
                <h1 class="mt-2 text-3xl font-semibold">결과 패키지</h1>
                <p class="mt-2 text-sm text-slate-400">진단, 설계안, 전환 초안을 하나의 설명 가능한 패키지로 묶어 제공합니다.</p>
            </div>
            <nav class="flex flex-wrap gap-2 text-sm">
                <a id="workspaceLink" href="#" class="rounded-full border border-white/10 px-4 py-2 hover:bg-white/5">워크스페이스</a>
                <button id="downloadMdBtn" class="rounded-full border border-white/10 px-4 py-2 hover:bg-white/5">Markdown 다운로드</button>
                <button id="downloadDocxBtn" class="rounded-full border border-white/10 px-4 py-2 hover:bg-white/5">DOCX 다운로드</button>
                <button id="printBtn" class="rounded-full border border-white/10 px-4 py-2 hover:bg-white/5">PDF 저장</button>
            </nav>
        </header>

        <div id="loadingState" class="mt-8 rounded-[2rem] border border-white/10 bg-slate-900/60 px-6 py-10 text-center text-sm text-slate-400">
            결과 패키지를 준비하는 중입니다.
        </div>
        <div id="errorState" class="mt-8 hidden rounded-[2rem] border border-rose-400/20 bg-rose-500/10 px-6 py-5 text-sm text-rose-200"></div>

        <main id="resultView" class="mt-8 hidden space-y-6">
            <section class="print-card rounded-[2rem] border border-white/10 bg-slate-900/60 p-6">
                <p class="text-xs uppercase tracking-[0.24em] text-slate-500">프로젝트</p>
                <h2 id="projectTitle" class="mt-3 text-3xl font-semibold">-</h2>
                <p id="projectMeta" class="mt-3 text-sm text-slate-400">-</p>
            </section>

            <section class="print-card rounded-[2rem] border border-cyan-300/20 bg-cyan-500/5 p-6">
                <p class="text-xs uppercase tracking-[0.24em] text-cyan-200">1페이지 요약</p>
                <div id="executiveSummaryBox" class="mt-4"></div>
            </section>

            <section class="grid gap-6 xl:grid-cols-[0.9fr_1.1fr]">
                <div class="print-card rounded-[2rem] border border-white/10 bg-slate-900/60 p-6">
                    <p class="text-xs uppercase tracking-[0.24em] text-slate-500">핵심 결론</p>
                    <div id="conclusionBox" class="mt-4 text-base leading-8 text-slate-100"></div>
                </div>
                <div class="print-card rounded-[2rem] border border-white/10 bg-slate-900/60 p-6">
                    <p class="text-xs uppercase tracking-[0.24em] text-slate-500">추천 방향</p>
                    <div id="directionBox" class="mt-4 space-y-3 text-sm text-slate-300"></div>
                </div>
            </section>

            <section class="print-card rounded-[2rem] border border-white/10 bg-slate-900/60 p-6">
                <p class="text-xs uppercase tracking-[0.24em] text-slate-500">진단</p>
                <div id="diagnosisBox" class="mt-4 space-y-4 text-sm text-slate-300"></div>
            </section>

            <section class="print-card rounded-[2rem] border border-white/10 bg-slate-900/60 p-6">
                <p class="text-xs uppercase tracking-[0.24em] text-slate-500">설계안</p>
                <div id="designBox" class="mt-4 space-y-5 text-sm text-slate-300"></div>
            </section>

            <section class="print-card rounded-[2rem] border border-white/10 bg-slate-900/60 p-6">
                <p class="text-xs uppercase tracking-[0.24em] text-slate-500">전환 초안</p>
                <div id="draftBox" class="mt-4 space-y-4 text-sm text-slate-300"></div>
            </section>

            <section class="print-card rounded-[2rem] border border-white/10 bg-slate-900/60 p-6">
                <p class="text-xs uppercase tracking-[0.24em] text-slate-500">부록</p>
                <div id="appendixBox" class="mt-4 space-y-4 text-sm text-slate-300"></div>
            </section>
        </main>
    </div>

    <script>
        const projectId = window.location.pathname.split('/')[2] || '';

        function authHeaders() {
            const token = localStorage.getItem('authToken') || localStorage.getItem('auth_token') || '';
            const headers = { 'Accept': 'application/json' };
            if (token) headers.Authorization = 'Bearer ' + token;
            return headers;
        }

        function parseFilenameFromDisposition(disposition, fallbackName) {
            if (!disposition) return fallbackName;
            const utf8Match = disposition.match(/filename\*=UTF-8''([^;]+)/i);
            if (utf8Match && utf8Match[1]) {
                try {
                    return decodeURIComponent(utf8Match[1]);
                } catch (error) {
                    return fallbackName;
                }
            }
            const asciiMatch = disposition.match(/filename=\"?([^\";]+)\"?/i);
            return asciiMatch && asciiMatch[1] ? asciiMatch[1] : fallbackName;
        }

        async function downloadWithAuth(url, fallbackName) {
            const headers = authHeaders();
            headers.Accept = '*/*';
            const res = await fetch(url, { headers: headers });
            if (!res.ok) {
                if (res.status === 401) throw new Error('로그인이 필요합니다.');
                if (res.status === 403) throw new Error('다운로드 권한이 없습니다.');
                throw new Error('다운로드에 실패했습니다.');
            }
            const blob = await res.blob();
            const disposition = res.headers.get('content-disposition') || '';
            const filename = parseFilenameFromDisposition(disposition, fallbackName);
            const blobUrl = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = blobUrl;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            link.remove();
            setTimeout(function () { URL.revokeObjectURL(blobUrl); }, 1000);
        }

        function listOrState(items, stateMessage) {
            if (items && items.length) {
                return items.map(function (item) {
                    return '<div class="rounded-2xl border border-white/10 bg-black/20 px-4 py-4">' + item + '</div>';
                }).join('');
            }
            return '<div class="rounded-2xl border border-dashed border-white/10 px-4 py-6 text-slate-500">' + stateMessage + '</div>';
        }

        function renderMissing(items, fallback) {
            if (!items || !items.length) {
                return '<div class="rounded-2xl border border-dashed border-white/10 px-4 py-6 text-slate-500">' + fallback + '</div>';
            }
            return items.map(function (item) {
                return '<div class="rounded-3xl border border-white/10 bg-black/20 px-4 py-4">' +
                    '<div class="text-xs uppercase tracking-[0.2em] text-slate-500">[필요 자료]</div>' +
                    '<div class="mt-2">- ' + (item.required_material || '-') + '</div>' +
                    '<div class="mt-4 text-xs uppercase tracking-[0.2em] text-slate-500">[이유]</div>' +
                    '<div class="mt-2">- ' + (item.reason || '-') + '</div>' +
                    '</div>';
            }).join('');
        }

        function renderLayerSection(title, section) {
            const values = section || [];
            if (!values.length) {
                return '<div><div class="text-xs uppercase tracking-[0.2em] text-slate-500">' + title + '</div><div class="mt-2 text-slate-500">데이터 없음</div></div>';
            }
            return '<div><div class="text-xs uppercase tracking-[0.2em] text-slate-500">' + title + '</div><div class="mt-3 space-y-2">' +
                values.map(function (item) { return '<div class="rounded-2xl border border-white/10 bg-black/20 px-4 py-3">' + item + '</div>'; }).join('') +
                '</div></div>';
        }

        function renderRules(rules, stateMessage) {
            const blocks = [];
            if (rules.status_permissions && rules.status_permissions.entities && rules.status_permissions.entities.length) {
                blocks.push('<div class="rounded-2xl border border-white/10 bg-black/20 px-4 py-4"><div class="text-xs uppercase tracking-[0.2em] text-slate-500">status_permissions</div><div class="mt-2">' + rules.status_permissions.entities.join(', ') + '</div></div>');
            }
            if (rules.search_filters && rules.search_filters.entities && rules.search_filters.entities.length) {
                blocks.push('<div class="rounded-2xl border border-white/10 bg-black/20 px-4 py-4"><div class="text-xs uppercase tracking-[0.2em] text-slate-500">search_filters</div><div class="mt-2">' + rules.search_filters.entities.join(', ') + '</div></div>');
            }
            if (rules.save_validation && rules.save_validation.entities && rules.save_validation.entities.length) {
                blocks.push('<div class="rounded-2xl border border-white/10 bg-black/20 px-4 py-4"><div class="text-xs uppercase tracking-[0.2em] text-slate-500">save_validation</div><div class="mt-2">' + rules.save_validation.entities.join(', ') + '</div></div>');
            }
            return blocks.length ? blocks.join('') : '<div class="rounded-2xl border border-dashed border-white/10 px-4 py-6 text-slate-500">' + stateMessage + '</div>';
        }

        function escapeHtml(value) {
            return String(value == null ? '' : value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatLocalDate(value) {
            if (!value) return '-';
            const date = new Date(value);
            if (Number.isNaN(date.getTime())) return '-';
            return date.toLocaleString();
        }

        function inferAssetType(asset) {
            const contentType = (asset.content_type || '').trim();
            if (contentType) return contentType;
            const name = (asset.name || '').toLowerCase();
            const ext = name.includes('.') ? name.split('.').pop() : '';
            if (ext) return ext.toUpperCase();
            return 'Unknown';
        }

        function renderAppendixAssets(assets) {
            if (!assets || !assets.length) {
                return '<div class="rounded-2xl border border-dashed border-white/10 px-4 py-6 text-slate-500">데이터 없음</div>';
            }
            return '<div class="grid gap-3 md:grid-cols-2">' + assets.map(function (item) {
                const actionNode = item.is_downloadable
                    ? '<button data-download-url="' + escapeHtml(item.download_url || '#') + '" data-download-name="' + escapeHtml(item.name || 'asset.bin') + '" class="asset-download-btn inline-flex rounded-full border border-cyan-400/20 bg-cyan-500/10 px-3 py-1 text-xs text-cyan-200 hover:bg-cyan-500/20">다운로드</button>'
                    : '<span class="text-xs text-slate-500">재열람 불가</span>';
                return '<div class="rounded-2xl border border-white/10 bg-black/20 px-4 py-4">' +
                    '<div class="flex items-start justify-between gap-3">' +
                    '<div class="text-sm font-medium text-slate-100">' + escapeHtml(item.name || '-') + '</div>' +
                    '<span class="rounded-full border border-white/10 bg-white/5 px-2 py-1 text-[11px] text-slate-300">' + escapeHtml(inferAssetType(item)) + '</span>' +
                    '</div>' +
                    '<div class="mt-3 space-y-1 text-xs text-slate-500">' +
                    '<div>크기: ' + escapeHtml(item.size || 0) + ' bytes</div>' +
                    '<div>업로드 시각: ' + escapeHtml(formatLocalDate(item.uploaded_at)) + '</div>' +
                    '<div>다운로드 가능: ' + escapeHtml(item.is_downloadable ? '예' : '아니오') + '</div>' +
                    '</div>' +
                    '<div class="mt-4 flex items-center justify-between gap-3">' +
                    '<span class="text-[11px] text-slate-500">temp_file_id: ' + escapeHtml(item.temp_file_id || '-') + '</span>' +
                    actionNode +
                    '</div>' +
                    '</div>';
            }).join('') + '</div>';
        }

        function renderProvenance(provenance) {
            const prov = provenance || {};
            return '<div class="rounded-2xl border border-white/10 bg-black/20 px-4 py-4">' +
                '<div class="text-xs uppercase tracking-[0.2em] text-slate-500">Provenance</div>' +
                '<div class="mt-3 grid gap-3 md:grid-cols-2">' +
                    '<div><div class="text-[11px] text-slate-500">Run ID</div><div class="mt-1 text-sm text-slate-200">' + escapeHtml(prov.run_id || '-') + '</div></div>' +
                    '<div><div class="text-[11px] text-slate-500">생성 기준 시각</div><div class="mt-1 text-sm text-slate-200">' + escapeHtml(formatLocalDate(prov.generated_at)) + '</div></div>' +
                    '<div><div class="text-[11px] text-slate-500">Run 상태</div><div class="mt-1 text-sm text-slate-200">' + escapeHtml(prov.run_status || '-') + '</div></div>' +
                    '<div><div class="text-[11px] text-slate-500">앱 버전</div><div class="mt-1 text-sm text-slate-200">' + escapeHtml(prov.app_version || '-') + '</div></div>' +
                    '<div><div class="text-[11px] text-slate-500">모듈 버전</div><div class="mt-1 text-sm text-slate-200">' + escapeHtml(prov.module_version || '-') + '</div></div>' +
                    '<div><div class="text-[11px] text-slate-500">템플릿 키</div><div class="mt-1 text-sm text-slate-200">' + escapeHtml(prov.template_key || '-') + '</div></div>' +
                '</div>' +
                '<div class="mt-4 text-xs text-slate-500">입력 자산 수: ' + escapeHtml((prov.input_assets || []).length) + '</div>' +
                '</div>';
        }

        function renderScopeNotice(scopeNotice) {
            const notice = scopeNotice || {};
            if (!notice.version_label) {
                return '<div class="rounded-2xl border border-rose-400/20 bg-rose-500/10 px-4 py-4">' +
                    '<div class="text-xs uppercase tracking-[0.2em] text-rose-200">범위 및 한계</div>' +
                    '<div class="mt-3 text-sm font-medium text-rose-100">scope_notice missing</div>' +
                    '<div class="mt-2 text-sm text-rose-200">결과 패키지 정본에서 scope_notice가 누락되었습니다.</div>' +
                    '</div>';
            }
            const supported = notice.supported || [];
            const notSupported = notice.not_supported || [];
            return '<div class="rounded-2xl border border-amber-300/20 bg-amber-500/5 px-4 py-4">' +
                '<div class="text-xs uppercase tracking-[0.2em] text-amber-200">범위 및 한계</div>' +
                '<div class="mt-3 text-sm font-medium text-slate-100">' + escapeHtml(notice.version_label || '-') + '</div>' +
                '<div class="mt-2 text-sm text-slate-300">' + escapeHtml(notice.summary || '-') + '</div>' +
                '<div class="mt-4 grid gap-4 md:grid-cols-2">' +
                    '<div><div class="text-[11px] text-slate-500">지원 범위</div><div class="mt-2 space-y-2">' +
                        supported.map(function (item) { return '<div class="rounded-2xl border border-white/10 bg-black/20 px-3 py-2 text-xs text-slate-300">' + escapeHtml(item) + '</div>'; }).join('') +
                    '</div></div>' +
                    '<div><div class="text-[11px] text-slate-500">비지원 범위</div><div class="mt-2 space-y-2">' +
                        notSupported.map(function (item) { return '<div class="rounded-2xl border border-white/10 bg-black/20 px-3 py-2 text-xs text-slate-300">' + escapeHtml(item) + '</div>'; }).join('') +
                    '</div></div>' +
                '</div>' +
                '</div>';
        }

        function renderExecutiveSummary(summary) {
            const executive = summary || {};
            if (!executive.title) {
                return '<div class="rounded-2xl border border-rose-400/20 bg-rose-500/10 px-4 py-4 text-sm text-rose-200">executive_summary missing</div>';
            }
            const renderBulletGroup = function (title, items) {
                const values = (items && items.length) ? items : ['해당 없음'];
                return '<div class="rounded-2xl border border-white/10 bg-black/20 px-4 py-4">' +
                    '<div class="text-xs uppercase tracking-[0.2em] text-slate-500">' + title + '</div>' +
                    '<div class="mt-3 space-y-2">' +
                    values.map(function (item) {
                        return '<div class="rounded-2xl border border-white/10 bg-white/5 px-3 py-2 text-sm text-slate-200">' + escapeHtml(item) + '</div>';
                    }).join('') +
                    '</div>' +
                    '</div>';
            };
            return '<div>' +
                '<div class="flex flex-wrap items-center justify-between gap-3">' +
                    '<div class="text-lg font-semibold text-slate-100">' + escapeHtml(executive.title || '-') + '</div>' +
                    '<div class="rounded-full border border-cyan-300/20 bg-cyan-500/10 px-3 py-1 text-xs text-cyan-200">' + escapeHtml(executive.state || '-') + '</div>' +
                '</div>' +
                '<div class="mt-4 rounded-2xl border border-white/10 bg-black/20 px-4 py-4">' +
                    '<div class="text-xs uppercase tracking-[0.2em] text-slate-500">핵심 결론</div>' +
                    '<div class="mt-3 text-sm leading-7 text-slate-100">' + escapeHtml(executive.core_message || '-') + '</div>' +
                '</div>' +
                '<div class="mt-4 grid gap-4 md:grid-cols-3">' +
                    renderBulletGroup('현대화 방향', executive.modernization_direction || []) +
                    renderBulletGroup('주요 리스크', executive.key_risks || []) +
                    renderBulletGroup('다음 단계', executive.next_steps || []) +
                '</div>' +
                '</div>';
        }

        function renderPackage(pkg) {
            document.getElementById('loadingState').classList.add('hidden');
            document.getElementById('resultView').classList.remove('hidden');
            document.getElementById('workspaceLink').href = '/projects/' + encodeURIComponent(projectId);
            document.getElementById('projectTitle').textContent = pkg.project.project_name || '프로젝트';
            document.getElementById('projectMeta').textContent = (pkg.project.client_name || '-') + ' · 상태 ' + (pkg.project.status || '-') + ' · 템플릿 ' + (pkg.project.template_key || '-');
            document.getElementById('executiveSummaryBox').innerHTML = renderExecutiveSummary(pkg.executive_summary || {});
            document.getElementById('conclusionBox').textContent = pkg.core_conclusion || '결과 생성 중';
            document.getElementById('directionBox').innerHTML = listOrState(pkg.recommended_directions || [], pkg.diagnosis.state || '결과 생성 중');

            const diagnosisHtml = [];
            diagnosisHtml.push('<div><div class="text-xs uppercase tracking-[0.2em] text-slate-500">analysis_summary</div><div class="mt-3">' + listOrState(pkg.diagnosis.analysis_summary || [], pkg.diagnosis.state) + '</div></div>');
            diagnosisHtml.push('<div><div class="text-xs uppercase tracking-[0.2em] text-slate-500">risks</div><div class="mt-3">' + listOrState(pkg.diagnosis.risks || [], pkg.diagnosis.state) + '</div></div>');
            diagnosisHtml.push('<div><div class="text-xs uppercase tracking-[0.2em] text-slate-500">missing_context</div><div class="mt-3">' + renderMissing(pkg.diagnosis.missing_context_details || [], pkg.diagnosis.state) + '</div></div>');
            document.getElementById('diagnosisBox').innerHTML = diagnosisHtml.join('');

            const design = pkg.design || {};
            const layer = design.layer_reconstruction || {};
            document.getElementById('designBox').innerHTML =
                '<div><div class="text-xs uppercase tracking-[0.2em] text-slate-500">rebuild_strategy</div><div class="mt-3">' + listOrState(design.rebuild_strategy || [], design.state) + '</div></div>' +
                '<div class="grid gap-4 md:grid-cols-3">' +
                    renderLayerSection('database', layer.database) +
                    renderLayerSection('backend', layer.backend) +
                    renderLayerSection('frontend', layer.frontend) +
                '</div>' +
                '<div><div class="text-xs uppercase tracking-[0.2em] text-slate-500">extracted_rules</div><div class="mt-3">' + renderRules(design.extracted_rules || {}, design.state) + '</div></div>';

            const draft = pkg.transition_draft || {};
            const recomposition = draft.recomposition_draft || {};
            document.getElementById('draftBox').innerHTML =
                '<div class="grid gap-4 md:grid-cols-3">' +
                    renderLayerSection('database', recomposition.database) +
                    renderLayerSection('backend', recomposition.backend) +
                    renderLayerSection('frontend', recomposition.frontend) +
                '</div>';

            const appendix = pkg.appendix || {};
            const assets = pkg.assets || appendix.asset_manifest || [];
            const provenance = pkg.provenance || {};
            const scopeNotice = pkg.scope_notice;
            document.getElementById('appendixBox').innerHTML =
                renderProvenance(provenance) +
                renderScopeNotice(scopeNotice) +
                '<div class="rounded-2xl border border-white/10 bg-black/20 px-4 py-4">' +
                    '<div>생성 시각: ' + (appendix.created_at ? new Date(appendix.created_at).toLocaleString() : '-') + '</div>' +
                    '<div class="mt-2">run 상태: ' + (appendix.run_status || '-') + '</div>' +
                '</div>' +
                renderAppendixAssets(assets);
        }

        async function bootstrap() {
            try {
                const res = await fetch('/projects/' + encodeURIComponent(projectId) + '/result?format=json', { headers: authHeaders() });
                if (!res.ok) throw new Error(res.status === 403 ? '프로젝트 접근 권한이 없습니다.' : '결과 패키지를 불러오지 못했습니다.');
                const pkg = await res.json();
                renderPackage(pkg);
            } catch (error) {
                document.getElementById('loadingState').classList.add('hidden');
                document.getElementById('errorState').classList.remove('hidden');
                document.getElementById('errorState').textContent = error.message || String(error);
            }
        }

        document.getElementById('printBtn').addEventListener('click', function () {
            window.print();
        });
        document.getElementById('downloadMdBtn').addEventListener('click', async function () {
            try {
                await downloadWithAuth('/projects/' + encodeURIComponent(projectId) + '/result?format=md', 'project_result.md');
            } catch (error) {
                document.getElementById('errorState').classList.remove('hidden');
                document.getElementById('errorState').textContent = error.message || String(error);
            }
        });
        document.getElementById('downloadDocxBtn').addEventListener('click', async function () {
            try {
                await downloadWithAuth('/projects/' + encodeURIComponent(projectId) + '/result?format=docx', 'project_result.docx');
            } catch (error) {
                document.getElementById('errorState').classList.remove('hidden');
                document.getElementById('errorState').textContent = error.message || String(error);
            }
        });
        document.addEventListener('click', async function (event) {
            const button = event.target.closest('.asset-download-btn');
            if (!button) return;
            event.preventDefault();
            try {
                await downloadWithAuth(button.getAttribute('data-download-url') || '#', button.getAttribute('data-download-name') || 'asset.bin');
            } catch (error) {
                document.getElementById('errorState').classList.remove('hidden');
                document.getElementById('errorState').textContent = error.message || String(error);
            }
        });
        bootstrap();
    </script>
</body>
</html>
