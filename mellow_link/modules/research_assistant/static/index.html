<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Research Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
    <div class="max-w-4xl mx-auto px-6 py-10">
        <a href="/ui" class="text-sm text-emerald-300 hover:text-emerald-200">Home</a>
        <h1 class="text-3xl font-semibold mt-4">Research Assistant</h1>
        <p class="text-slate-400 mt-2">리서치/정리 run을 시작합니다.</p>
        <div class="mt-6 rounded-3xl border border-white/10 bg-slate-900/60 p-6 space-y-4">
            <textarea id="question" rows="6" class="w-full rounded-2xl bg-slate-950/70 border border-white/10 px-4 py-3 text-sm" placeholder="분석하고 싶은 질문"></textarea>
            <textarea id="contextNote" rows="4" class="w-full rounded-2xl bg-slate-950/70 border border-white/10 px-4 py-3 text-sm" placeholder="추가 문맥 또는 문서 메모"></textarea>
            <button id="startBtn" class="px-5 py-3 rounded-xl bg-emerald-400 text-slate-950 font-medium hover:bg-emerald-300">Start Research Run</button>
        </div>
    </div>
    <script>
        function authHeaders(extra) {
            const token = localStorage.getItem('authToken');
            const headers = Object.assign({}, extra || {});
            if (token) headers['Authorization'] = 'Bearer ' + token;
            return headers;
        }
        document.getElementById('startBtn').addEventListener('click', async function () {
            const question = (document.getElementById('question').value || '').trim();
            const contextNote = document.getElementById('contextNote').value || '';
            if (!question) return;
            const res = await fetch('/modules/research_assistant/runs', {
                method: 'POST',
                headers: authHeaders({ 'Content-Type': 'application/json' }),
                body: JSON.stringify({ question: question, context_note: contextNote })
            });
            if (!res.ok) return;
            const data = await res.json();
            window.location.href = '/user-console?run_id=' + encodeURIComponent(data.run_id);
        });
    </script>
</body>
</html>
