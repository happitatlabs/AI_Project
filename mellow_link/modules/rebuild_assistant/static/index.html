<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rebuild Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-stone-950 text-stone-100">
    <div class="mx-auto flex min-h-screen max-w-4xl items-center px-6 py-12">
        <div class="w-full rounded-[28px] border border-white/10 bg-stone-900/70 p-8 shadow-2xl shadow-black/30">
            <a href="/projects/create" class="text-sm text-cyan-300 hover:text-cyan-200">레거시 현대화 분석으로 이동</a>
            <h1 class="mt-4 text-3xl font-semibold">Rebuild Assistant</h1>
            <p class="mt-3 text-sm leading-7 text-stone-300">
                이 파일럿 화면의 raw 실행 경로는 비활성화되었습니다.
                이제 실행은 프로젝트 기반 safe bundle 흐름에서만 허용됩니다.
            </p>
            <div class="mt-6 rounded-2xl border border-amber-300/20 bg-amber-400/10 p-5 text-sm text-amber-100">
                <div class="font-medium">변경 사항</div>
                <ul class="mt-3 space-y-2 text-amber-50/90">
                    <li>원본 자산 직접 전달 방식은 차단되었습니다.</li>
                    <li>익명화된 canonical source와 structure를 포함한 safe bundle만 분석에 사용합니다.</li>
                    <li>실행은 <code>/projects/create</code>에서 프로젝트를 생성한 뒤 진행하세요.</li>
                </ul>
            </div>
            <div class="mt-8 flex flex-wrap gap-3">
                <a href="/projects/create" class="rounded-xl bg-amber-300 px-5 py-3 font-medium text-stone-950 hover:bg-amber-200">
                    새 프로젝트 시작
                </a>
                <button disabled class="cursor-not-allowed rounded-xl border border-white/10 bg-stone-800 px-5 py-3 text-sm text-stone-400">
                    Raw Run Disabled
                </button>
            </div>
        </div>
    </div>
</body>
</html>
