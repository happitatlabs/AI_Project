    promotion_reason:
      - low-signal 샘플에서도 structural_judgment와 narrative_axis가 분리되는지 검증한다.
      - decision_count 0인 경우에도 설명 surface가 구조 판단을 과장하지 않는지 고정한다.
    measured_behavior:
      - detector가 발생하지 않는 저강도 CRUD/query sample로 정리됐다.
      - query/filter 중심 read path가 narrative를 주도하고, structural decision은 발생하지 않는다.
    inferred_from_markdown:
      - human review markdown는 참고 문서이며 measured anchor의 직접 source가 아니다.
      - execution plan anchor는 prose equality가 아니라 stage count와 경계 title을 사용한다.
